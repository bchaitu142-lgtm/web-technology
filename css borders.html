<!DOCTYPE html>
<html lang="en">
<head>
<style>
h1{
background-color: aqua;
color: darkblue;
}

p{
background-color: aliceblue;
color: cornflowerblue;
}

.box1{
border: 5px dashed black;
}

.box2{
border: 3px dotted black;
}

.box3{
border: 5px double black;
}

.box4{
 border: 3px solid black;   
}


</style>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
 <h1> CSS Borders</h1>   

 <p> This Paragraph has a solid border</p>

 <h1><p class="box1"> This is a dashed border</p></h1>
 <h1><p class="box2"> This is a dotted border</p></h1>
 <h1><p class="box3"> This is a double border</p></h1>
 <h1><p class="box4"> This is a rounded border</p></h1>
</body>
</html>
